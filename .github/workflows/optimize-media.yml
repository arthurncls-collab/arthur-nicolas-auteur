name: Optimize site media

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/optimize-media.yml"
      - "scripts/optimize_media.py"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Create optimized media
        run: |
          mkdir -p assets/books assets/photos assets/social
          curl -L --fail --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3ITd6pgINnP96WmT6fmjnUlGJFT/9fbd618b-0db1-48c8-8bb6-c871122dea91.jpg" -o /tmp/interpolis.jpg
          python scripts/optimize_media.py

      - name: Commit optimized media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/books assets/photos/*.webp assets/social
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Optimise les images du site"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
