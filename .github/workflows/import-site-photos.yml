name: Import site photos

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-site-photos.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download photos
        run: |
          mkdir -p assets/photos
          curl -L --fail --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3ITd6pgINnP96WmT6fmjnUlGJFT/541e9700-059a-454a-b3b4-cb0094e45858.jpg" -o assets/photos/arthur-reading-ravenscrow.jpg
          curl -L --fail --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3ITd6pgINnP96WmT6fmjnUlGJFT/4c7d7974-24e6-4328-82b7-87a3e81ac54e.jpg" -o assets/photos/podcast-dans-ombre-livres.jpg
          curl -L --fail --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3ITd6pgINnP96WmT6fmjnUlGJFT/55668f41-9734-4c98-bf58-408df77242c0.jpg" -o assets/photos/arthur-signing-ravenscrow.jpg
          curl -L --fail --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3ITd6pgINnP96WmT6fmjnUlGJFT/50291387-243b-4919-8e77-8e6717c3fcbd.jpg" -o assets/photos/arthur-author-ravenscrow.jpg

      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Ajoute les photos auteur au site"
          git push
